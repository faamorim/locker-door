<title>The Locker Room Proof</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #E9EDEC;
    --surface: #FFFFFF;
    --ink: #1C2530;
    --ink-muted: #5B6B72;
    --line: #C9D2D1;
    --locker-closed: #3D6C86;
    --locker-closed-edge: #2C5064;
    --locker-inside: #12181C;
    --accent: #D79A3B;
    --accent-strong: #B97D22;
    --accent-ink: #3A2A0E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10151A;
      --surface: #182029;
      --ink: #E7ECEE;
      --ink-muted: #93A3AA;
      --line: #2B363E;
      --locker-closed: #5D879F;
      --locker-closed-edge: #446378;
      --locker-inside: #05080A;
      --accent: #E7B65C;
      --accent-strong: #F2C877;
      --accent-ink: #2A1E08;
    }
  }
  :root[data-theme="dark"]{
    --bg: #10151A;
    --surface: #182029;
    --ink: #E7ECEE;
    --ink-muted: #93A3AA;
    --line: #2B363E;
    --locker-closed: #5D879F;
    --locker-closed-edge: #446378;
    --locker-inside: #05080A;
    --accent: #E7B65C;
    --accent-strong: #F2C877;
    --accent-ink: #2A1E08;
  }

  #locker-app, #locker-app *{ box-sizing: border-box; }
  #locker-app{
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding: 1.75rem 1rem 2.5rem;
    max-width: 100%;
  }
  #locker-app .stage{
    max-width: 47.5rem;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    position: relative;
  }

  #locker-app #remSentinel{
    position: absolute;
    top: 0;
    left: 0;
    width: 1rem;
    height: 1rem;
    visibility: hidden;
    pointer-events: none;
  }

  #locker-app .hallway{
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface) 70%, color-mix(in srgb, var(--locker-closed) 12%, var(--surface)) 100%);
    border: 1px solid var(--line);
    border-radius: 0.625rem;
    padding: 0.875rem 1rem 1rem;
  }
  #locker-app .hallway-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.625rem;
  }
  #locker-app .hallway-label{
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }
  #locker-app .waiting-count{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8125rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  #locker-app .queue-frame{
    position: relative;
  }
  #locker-app .queue{
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    min-height: 2.125rem;
    align-items: center;
    border-bottom: 2px dashed var(--line);
    padding-bottom: 0.75rem;
  }
  #locker-app #queueMeasure{
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #locker-app .student{
    font-size: 1.1875rem;
    line-height: 1;
    opacity: 1;
    transform: translateX(0) scale(1);
    transition: opacity .32s ease, transform .32s ease;
    filter: grayscale(0);
  }
  #locker-app .student.next{
    transform: scale(1.18);
  }
  #locker-app .student.leaving{
    opacity: 0;
    transform: translateX(-0.875rem) scale(0.7);
  }

  #locker-app .controls{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.875rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.625rem;
    padding: 0.875rem 1rem;
  }
  #locker-app .status{
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.35;
    flex: 1 1 13.75rem;
    min-height: var(--status-h, 2.5rem);
    display: flex;
    align-items: center;
  }
  #locker-app .status-text{
    display: block;
  }
  #locker-app .status .num{
    font-family: "IBM Plex Mono", monospace;
    color: var(--accent-strong);
  }
  #locker-app #statusMeasure{
    position: absolute;
    visibility: hidden;
    pointer-events: none;
  }
  #locker-app .buttons{
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    min-width: 0;
  }
  #locker-app button{
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.8125rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 0.625rem 1rem;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  #locker-app button:hover:not(:disabled){ transform: translateY(-1px); }
  #locker-app button:active:not(:disabled){ transform: translateY(0); }
  #locker-app button:focus-visible{ outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  #locker-app button:disabled{ opacity: 0.45; cursor: default; }
  #locker-app #playBtn{
    background: var(--accent);
    border-color: var(--accent-strong);
    color: var(--accent-ink);
    box-shadow: 0 2px 0 var(--accent-strong);
  }
  #locker-app #playBtn:active:not(:disabled){ box-shadow: none; }
  #locker-app .speed{
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--ink-muted);
    font-weight: 600;
  }
  #locker-app .speed input{ accent-color: var(--accent-strong); }

  #locker-app .compact-toggle{
    display: flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.75rem;
    color: var(--ink-muted);
    font-weight: 600;
    cursor: pointer;
  }
  #locker-app .compact-toggle input{ accent-color: var(--accent-strong); }

  #locker-app .jump-controls{
    flex-direction: column;
    align-items: stretch;
    gap: 0.5rem;
  }
  #locker-app .jump-label{
    font-size: 0.8125rem;
    font-weight: 600;
  }
  #locker-app .jump-label strong{
    font-family: "IBM Plex Mono", monospace;
    color: var(--accent-strong);
    font-weight: 700;
  }
  #locker-app #jumpRange{
    width: 100%;
    accent-color: var(--accent-strong);
  }

  #locker-app .grid-wrap{
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0.625rem;
    padding: 1rem;
  }
  #locker-app .grid{
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 0.5rem;
  }
  #locker-app .locker-frame{
    width: 100%;
    aspect-ratio: 5 / 6;
    position: relative;
    perspective: 240px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--locker-inside);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #locker-app .locker-inside{
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, var(--locker-inside), var(--locker-inside) 60%, color-mix(in srgb, var(--locker-inside) 60%, white) 61%, var(--locker-inside) 64%);
  }
  #locker-app .locker-door{
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, var(--locker-closed) 0%, var(--locker-closed-edge) 100%);
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform .32s cubic-bezier(.4,0,.2,1), background .32s ease;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  #locker-app .locker.open .locker-door{
    transform: rotateY(-62deg);
    background: linear-gradient(115deg, color-mix(in srgb, var(--locker-closed) 70%, white) 0%, var(--locker-closed) 100%);
  }
  #locker-app .locker-door .handle{
    position: absolute;
    right: 8%;
    bottom: 6%;
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 50%;
    background: var(--accent);
  }
  #locker-app .locker.visiting .locker-frame{
    box-shadow: 0 0 0 2px var(--accent), 0 0 10px 1px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  #locker-app .locker-label{
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.125rem;
    padding: 0.2rem;
    pointer-events: none;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }
  #locker-app .locker.open .locker-label{
    color: var(--accent);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  #locker-app .locker-number{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #locker-app .locker-by{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.5rem;
    line-height: 1.15;
    text-align: center;
    overflow: hidden;
    word-break: break-word;
  }
  #locker-app .sqrt-factor{
    font-weight: 700;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 1.5px;
  }
  #locker-app.compact .locker-by{
    display: none;
  }
  #locker-app.compact .locker-number{
    font-size: 0.875rem;
  }

  #locker-app .walker{
    position: absolute;
    top: 0;
    left: 0;
    font-size: 1.25rem;
    transform: translate(-50%, -120%);
    transition: left .22s ease, top .22s ease;
    pointer-events: none;
    z-index: 5;
  }

  #locker-app .legend{
    display: flex;
    flex-wrap: wrap;
    gap: 0.875rem;
    align-items: center;
    font-size: 0.75rem;
    color: var(--ink-muted);
    margin: 0;
  }
  #locker-app .swatch{
    display: inline-block;
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 2px;
    margin-right: 0.25rem;
    vertical-align: -1px;
    background: var(--locker-closed);
  }
  #locker-app .swatch.open{
    background: color-mix(in srgb, var(--locker-closed) 70%, white);
  }

  @media (prefers-reduced-motion: reduce){
    #locker-app *{ transition: none !important; }
  }
</style>

<div id="locker-app">
  <div class="stage">
    <span id="remSentinel" aria-hidden="true"></span>

    <div class="hallway">
      <div class="hallway-head">
        <span class="hallway-label">Waiting in line</span>
        <span class="waiting-count"><span id="waitingCount">50</span> left</span>
      </div>
      <div class="queue-frame">
        <div class="queue" id="queue"></div>
        <div class="queue" id="queueMeasure" aria-hidden="true"></div>
      </div>
    </div>

    <div class="controls">
      <div class="status" id="status"><span class="status-text">Student <span class="num">1</span> of 50 is next</span></div>
      <div id="statusMeasure" aria-hidden="true"></div>
      <div class="buttons">
        <button id="stepBtn" type="button">Step</button>
        <button id="playBtn" type="button">Play</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
      <label class="speed">
        Speed
        <input type="range" id="speedRange" min="60" max="500" value="220" step="20">
      </label>
      <label class="compact-toggle">
        <input type="checkbox" id="compactToggle">
        Compact (numbers only)
      </label>
    </div>

    <div class="controls jump-controls">
      <label class="jump-label" for="jumpRange"><strong id="jumpValue">0</strong> student<span id="jumpPlural">s</span> <span id="jumpVerb">have</span> gone</label>
      <input type="range" id="jumpRange" min="0" max="50" value="0" step="1">
    </div>

    <div class="grid-wrap" id="gridWrap">
      <div class="grid" id="grid"></div>
      <div class="walker" id="walker" hidden>&#128694;</div>
    </div>

    <p class="legend">
      <span><span class="swatch open"></span>Open</span>
      <span><span class="swatch"></span>Closed</span>
      <span>Numbers on each door: which students toggled it</span>
      <span>Underlined factor: its square root</span>
    </p>
  </div>
</div>

<script>
(function(){
  var N = 50;
  var MIN_DOOR_REM = 3;
  var MIN_DOOR_REM_COMPACT = 1.2;
  var GRID_GAP_REM = 0.5;
  var DONE_MESSAGE_HTML = 'All 50 done \u2014 only the <strong>perfect squares</strong> (1, 4, 9, 16, 25, 36, 49) stayed closed.';

  function statusHTML(inner){
    return '<span class="status-text">' + inner + '</span>';
  }

  var app = document.getElementById('locker-app');
  var remSentinelEl = document.getElementById('remSentinel');
  var queueEl = document.getElementById('queue');
  var queueMeasureEl = document.getElementById('queueMeasure');
  var gridEl = document.getElementById('grid');
  var gridWrap = document.getElementById('gridWrap');
  var walkerEl = document.getElementById('walker');
  var statusEl = document.getElementById('status');
  var statusMeasureEl = document.getElementById('statusMeasure');
  var waitingCountEl = document.getElementById('waitingCount');
  var stepBtn = document.getElementById('stepBtn');
  var playBtn = document.getElementById('playBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedRange = document.getElementById('speedRange');
  var compactToggle = document.getElementById('compactToggle');
  var jumpRange = document.getElementById('jumpRange');
  var jumpValueEl = document.getElementById('jumpValue');
  var jumpPluralEl = document.getElementById('jumpPlural');
  var jumpVerbEl = document.getElementById('jumpVerb');

  var lockers, lockerEls, queueEls, currentStudent, walkIndex, playing, playToken, dequeued, lastVisited;

  function multiplesOf(s){
    var arr = [];
    for (var n = s; n <= N; n += s) arr.push(n);
    return arr;
  }

  function createStudentSpan(s){
    var span = document.createElement('span');
    span.className = 'student';
    span.textContent = '\uD83E\uDDCD';
    span.title = 'Student ' + s;
    span.dataset.n = s;
    return span;
  }

  function buildQueue(){
    queueEl.innerHTML = '';
    queueEls = {};
    for (var s = 1; s <= N; s++){
      var span = createStudentSpan(s);
      queueEl.appendChild(span);
      queueEls[s] = span;
    }

    if (!queueMeasureEl.childNodes.length){
      for (var m = 1; m <= N; m++){
        var mSpan = document.createElement('span');
        mSpan.className = 'student';
        mSpan.textContent = '\uD83E\uDDCD';
        queueMeasureEl.appendChild(mSpan);
      }
    }
    measureQueueHeight();
  }

  function syncQueueTo(k){
    queueEl.innerHTML = '';
    queueEls = {};
    for (var s = k + 1; s <= N; s++){
      var span = createStudentSpan(s);
      queueEl.appendChild(span);
      queueEls[s] = span;
    }
    waitingCountEl.textContent = String(N - k);
  }

  function measureQueueHeight(){
    queueEl.style.minHeight = queueMeasureEl.offsetHeight + 'px';
  }

  function remPx(){
    return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  }

  function computeColumns(){
    var r = remPx();
    var gapPx = GRID_GAP_REM * r;
    var minDoorPx = (app.classList.contains('compact') ? MIN_DOOR_REM_COMPACT : MIN_DOOR_REM) * r;
    var availablePx = gridEl.getBoundingClientRect().width;
    if (!availablePx) return 10;

    function fits(n){
      var totalGap = gapPx * (n - 1);
      return (availablePx - totalGap) / n >= minDoorPx;
    }

    if (fits(10)) return 10;
    if (fits(5)) return 5;
    var n = 4;
    while (n > 1 && !fits(n)) n--;
    return n;
  }

  function applyColumns(){
    gridEl.style.gridTemplateColumns = 'repeat(' + computeColumns() + ', 1fr)';
  }

  function measureStatusHeight(){
    var sampleWidth = statusEl.getBoundingClientRect().width;
    if (!sampleWidth) return;
    statusMeasureEl.style.width = sampleWidth + 'px';
    statusMeasureEl.className = statusEl.className;
    statusMeasureEl.innerHTML = statusHTML(DONE_MESSAGE_HTML);
    var h = statusMeasureEl.getBoundingClientRect().height;
    if (h) app.style.setProperty('--status-h', h + 'px');
  }

  function recomputeResponsiveLayout(){
    applyColumns();
    measureStatusHeight();
    measureQueueHeight();
  }

  function buildGrid(){
    gridEl.innerHTML = '';
    lockerEls = {};
    for (var n = 1; n <= N; n++){
      var cell = document.createElement('div');
      cell.className = 'locker';
      cell.dataset.n = n;

      var frame = document.createElement('div');
      frame.className = 'locker-frame';
      var inside = document.createElement('div');
      inside.className = 'locker-inside';
      var door = document.createElement('div');
      door.className = 'locker-door';
      var handle = document.createElement('span');
      handle.className = 'handle';
      door.appendChild(handle);
      frame.appendChild(inside);
      frame.appendChild(door);

      var label = document.createElement('div');
      label.className = 'locker-label';
      var num = document.createElement('div');
      num.className = 'locker-number';
      num.textContent = String(n).padStart(2, '0');
      var by = document.createElement('div');
      by.className = 'locker-by';
      label.appendChild(num);
      label.appendChild(by);
      frame.appendChild(label);

      cell.appendChild(frame);
      gridEl.appendChild(cell);
      lockerEls[n] = { cell: cell, by: by, frame: frame };
    }
  }

  function initState(){
    lockers = {};
    for (var n = 1; n <= N; n++) lockers[n] = { open: true, factors: [] };
    currentStudent = 0;
    walkIndex = 0;
    playing = false;
    playToken = 0;
    dequeued = {};
    lastVisited = null;
  }

  function renderLocker(n){
    var rec = lockers[n];
    var refs = lockerEls[n];
    refs.cell.classList.toggle('open', rec.open);
    refs.cell.classList.toggle('closed', !rec.open);
    if (!rec.factors.length){
      refs.by.textContent = '\u2014';
      return;
    }
    var sqrtN = Math.sqrt(n);
    refs.by.innerHTML = rec.factors.map(function(d){
      return d === sqrtN ? '<span class="sqrt-factor">' + d + '</span>' : String(d);
    }).join(', ');
  }

  function renderAllLockers(){
    for (var n = 1; n <= N; n++) renderLocker(n);
  }

  function toggleLocker(n, student){
    lockers[n].open = !lockers[n].open;
    lockers[n].factors.push(student);
    renderLocker(n);
  }

  function dequeue(s){
    if (dequeued[s]) return;
    dequeued[s] = true;
    var el = queueEls[s];
    if (el){
      el.classList.add('leaving');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 340);
    }
    waitingCountEl.textContent = String(N - Object.keys(dequeued).length);
  }

  function markNext(){
    for (var s = 1; s <= N; s++){
      if (queueEls[s]) queueEls[s].classList.toggle('next', s === currentStudent + 1);
    }
  }

  function updateStatus(){
    if (currentStudent >= N){
      statusEl.innerHTML = statusHTML(DONE_MESSAGE_HTML);
      stepBtn.disabled = true;
      playBtn.disabled = true;
      playBtn.textContent = 'Play';
    } else {
      var phase = playing ? 'is walking the hall\u2026' : (walkIndex > 0 ? 'is paused partway through' : 'is next');
      statusEl.innerHTML = statusHTML('Student <span class="num">' + (currentStudent + 1) + '</span> ' + phase);
      stepBtn.disabled = false;
      playBtn.disabled = false;
    }
    markNext();
    jumpRange.value = currentStudent;
    jumpValueEl.textContent = currentStudent;
    jumpPluralEl.textContent = currentStudent === 1 ? '' : 's';
    jumpVerbEl.textContent = currentStudent === 1 ? 'has' : 'have';
  }

  function hideWalker(){
    walkerEl.hidden = true;
    if (lastVisited && lockerEls[lastVisited]) lockerEls[lastVisited].cell.classList.remove('visiting');
    lastVisited = null;
  }

  function hideWalkerGlyph(){
    walkerEl.hidden = true;
  }

  function moveWalkerTo(n){
    var wrapRect = gridWrap.getBoundingClientRect();
    var lockRect = lockerEls[n].cell.getBoundingClientRect();
    var x = lockRect.left - wrapRect.left + lockRect.width / 2;
    var y = lockRect.top - wrapRect.top;
    walkerEl.style.left = x + 'px';
    walkerEl.style.top = y + 'px';
    walkerEl.hidden = false;
    if (lastVisited && lockerEls[lastVisited]) lockerEls[lastVisited].cell.classList.remove('visiting');
    lockerEls[n].cell.classList.add('visiting');
    lastVisited = n;
  }

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  function getSpeed(){
    var min = parseInt(speedRange.min, 10);
    var max = parseInt(speedRange.max, 10);
    var val = parseInt(speedRange.value, 10);
    return (min + max) - val; // slider right = higher value = shorter delay = faster
  }

  function finishCurrentStudentInstant(){
    if (currentStudent >= N) return;
    var s = currentStudent + 1;
    dequeue(s);
    var mult = multiplesOf(s);
    for (var i = walkIndex; i < mult.length; i++) toggleLocker(mult[i], s);
    walkIndex = 0;
    currentStudent = s;
    hideWalker();
    updateStatus();
  }

  function jumpTo(k){
    playToken++;
    playing = false;
    playBtn.textContent = 'Play';
    walkIndex = 0;
    currentStudent = k;
    hideWalker();

    dequeued = {};
    for (var s = 1; s <= k; s++) dequeued[s] = true;
    syncQueueTo(k);

    for (var n = 1; n <= N; n++){
      var factors = [];
      for (var d = 1; d <= k; d++){ if (n % d === 0) factors.push(d); }
      lockers[n] = { open: factors.length % 2 === 0, factors: factors };
      renderLocker(n);
    }
    updateStatus();
  }

  function onStep(){
    if (currentStudent >= N) return;
    stopPlaying();
    finishCurrentStudentInstant();
  }

  function stopPlaying(){
    playing = false;
    playBtn.textContent = 'Play';
  }

  async function runPlayLoop(){
    var token = ++playToken;
    while (playing && currentStudent < N && token === playToken){
      var s = currentStudent + 1;
      var mult = multiplesOf(s);
      if (walkIndex === 0) dequeue(s);
      updateStatus();

      while (walkIndex < mult.length && playing && token === playToken){
        var n = mult[walkIndex];
        moveWalkerTo(n);
        await sleep(getSpeed() / 2);
        if (!playing || token !== playToken) break;
        toggleLocker(n, s);
        await sleep(getSpeed() / 2);
        walkIndex++;
      }

      if (walkIndex >= mult.length && playing && token === playToken){
        hideWalkerGlyph();
        statusEl.innerHTML = statusHTML('Student <span class="num">' + s + '</span> finished' +
          (s < N ? ' \u2014 next up: student ' + (s + 1) + '\u2026' : '\u2026'));
        await sleep(getSpeed() * 5);
        if (!playing || token !== playToken) break;
        currentStudent = s;
        walkIndex = 0;
        hideWalker();
        updateStatus();
      }
    }
    if (token === playToken){
      playing = false;
      playBtn.textContent = 'Play';
      hideWalker();
      updateStatus();
    }
  }

  function onPlayToggle(){
    if (currentStudent >= N) return;
    if (playing){
      stopPlaying();
    } else {
      playing = true;
      playBtn.textContent = 'Pause';
      runPlayLoop();
    }
  }

  function onReset(){
    playing = false;
    playToken++;
    initState();
    buildQueue();
    renderAllLockers();
    hideWalker();
    waitingCountEl.textContent = String(N);
    updateStatus();
  }

  stepBtn.addEventListener('click', onStep);
  playBtn.addEventListener('click', onPlayToggle);
  resetBtn.addEventListener('click', onReset);
  jumpRange.addEventListener('input', function(){
    jumpTo(parseInt(jumpRange.value, 10));
  });
  compactToggle.addEventListener('change', function(){
    app.classList.toggle('compact', compactToggle.checked);
    applyColumns();
  });

  if (window.ResizeObserver){
    var ro = new ResizeObserver(function(){ recomputeResponsiveLayout(); });
    ro.observe(remSentinelEl);
    ro.observe(gridWrap);
  } else {
    var resizeTimer;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(recomputeResponsiveLayout, 150);
    });
  }

  buildGrid();
  buildQueue();
  initState();
  renderAllLockers();
  updateStatus();
  recomputeResponsiveLayout();
})();
</script>
